name: aot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  aot-check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish sample as Native AOT
        run: >
          dotnet publish samples/SourceGenMediator.SampleApp/SourceGenMediator.SampleApp.csproj
          -f net10.0 -r linux-x64 -p:EnableAotCheck=true
          -o publish/aot-check --nologo

      - name: Run AOT binary
        run: ./publish/aot-check/SourceGenMediator.SampleApp
